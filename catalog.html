<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — Кожевники А1</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,500;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Кожевники А1">
      <span class="logo-mark">А1</span>
      <span class="logo-text">Кожевники А1</span>
    </a>
    <nav class="main-nav">
      <a href="catalog.html">Каталог</a>
      <a href="about.html">О нас</a>
      <a href="reviews.html">Отзывы</a>
      <a href="delivery.html">Доставка</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Сменить тему">
        <span id="themeIcon">☀</span>
      </button>
      <a href="cart.html" class="btn btn-primary">Корзина (<span id="cart-count">0</span>)</a>
    </div>
  </div>
</header>

<section class="block">
  <div class="container">
    <div class="section-head">
      <h2>Все товары</h2>
    </div>
    
        <div style="margin-bottom: 20px;">
      <input type="text" id="search-input" placeholder="🔍 Поиск по названию или артикулу..." style="width: 100%; max-width: 400px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s;">
    </div>

    <!-- Кнопки фильтрации -->
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;">
      <button class="btn btn-outline filter-btn" data-filter="all" style="border-color: var(--accent); color: var(--accent);">Все</button>
      <button class="btn btn-outline filter-btn" data-filter="chasovye">Часовые ремешки</button>
      <button class="btn btn-outline filter-btn" data-filter="shablony">Шаблоны и колодки</button>
      <button class="btn btn-outline filter-btn" data-filter="pokraska">Покраска и отделка</button>
      <button class="btn btn-outline filter-btn" data-filter="hranenie">Хранение и органайзеры</button>
      <button class="btn btn-outline filter-btn" data-filter="instrumenty">Инструменты</button>
      <button class="btn btn-outline filter-btn" data-filter="bruski">Для брусовки</button>
      <button class="btn btn-outline filter-btn" data-filter="rashodniki">Разное</button>
      <button class="btn btn-outline filter-btn" data-filter="custom" style="border-color: var(--accent); color: var(--accent); font-weight: bold;">На заказ</button>
    </div>

    <div class="product-grid" id="product-container">
      <!-- Товары будут загружены через JS -->
      <p>Загрузка товаров...</p>
    </div>
  </div>
</section>

<script src="js/catalog.js"></script>
<script src="js/main.js"></script>`n</body>
</html>
